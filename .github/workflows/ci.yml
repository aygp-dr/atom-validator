name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
          bb: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ runner.os }}-${{ hashFiles('**/deps.edn', '**/bb.edn') }}
          restore-keys: clj-${{ runner.os }}-
      - run: bb check

      - name: Run coverage
        run: clojure -M:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: target/coverage/codecov.json
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for git-count-revs

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ runner.os }}-${{ hashFiles('**/deps.edn', '**/bb.edn') }}
          restore-keys: clj-${{ runner.os }}-

      - name: Build JAR
        run: clojure -T:build jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
